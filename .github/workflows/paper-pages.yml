name: Paper website
"on":
  pull_request:
    branches: [codex/paper-website, gh-pages]
  push:
    branches: [gh-pages]

permissions:
  contents: read

concurrency:
  group: paper-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify paper website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install browser test tools
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Exercise the overview and leaderboard
        run: npm test
      - name: Package the tested site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: paper-site

  deploy:
    name: Publish paper website
    if: github.event_name == 'push' && github.ref == 'refs/heads/gh-pages'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - name: Deploy the verified site
        id: release
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
