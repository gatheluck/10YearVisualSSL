# Everything the pre-commit hook runs, run again where nobody can skip it.
#
# The hook is machinery, but machinery on one machine: it needs
# `git config core.hooksPath .githooks` per clone, `--no-verify` skips it, and
# it only ever tested the platform the committer was using. Every end-to-end
# check before this ran on macOS arm64; the deployment target is linux x86_64.
#
# **Methods are discovered, not listed.** A hand-written matrix is a list, and
# a list goes stale the moment a method is added -- which is how the second
# method arrived with twelve of its tests silently skipping in CI while the
# job still reported success.
#
# Actions are pinned by commit SHA rather than by tag, for the same reason the
# container's base image is pinned by digest: a tag is a moving target, and a
# run that cannot be repeated proves less than it appears to.

name: tests

# **Push builds only the default branch, and that is about cost, not scope.**
# With no filter, a commit on a branch that has an open pull request started
# two runs of the same commit -- one for the push, one for the pull request.
# One full run is about 37 minutes of billed runner time, so that was roughly
# 56 minutes per commit for a suite that takes 15 seconds locally, and the
# account ran out of minutes mid-merge: the jobs then completed in two seconds
# with no steps and no log, which reads exactly like a broken workflow and is
# not one.
#
# Nothing loses coverage. A branch cannot reach `main` except through a pull
# request, and `pull_request` covers that.
on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first, and only the second answer is wanted.
# **The default branch is excluded**: cancelling there would destroy the record
# of whether a merged commit was good, which is the one record worth paying
# for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The claim that the core needs nothing installed, checked on Linux.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: .python-version
      - name: Run the suite with no dependencies installed
        run: ./tests/run-tests.sh

  # Every method that has a lock, found by looking rather than by listing.
  discover:
    runs-on: ubuntu-latest
    outputs:
      methods: ${{ steps.find.outputs.methods }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - id: find
        name: Find the methods that declare a locked environment
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          found = sorted(p.parent.name for p in
                         pathlib.Path("methods").glob("*/requirements.lock.txt"))
          if not found:
              raise SystemExit("no method declares a lock; nothing would run")
          print("methods=" + json.dumps(found))
          PY

  # Each method's locked environment, on the platform it is deployed to, with
  # that method's own tests actually running rather than skipping.
  locked:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        method: ${{ fromJSON(needs.discover.outputs.methods) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      # Most of this job is downloading torch, once per method per run.
      # **Keyed on the lock files**, so a changed lock misses the cache: the
      # cache can never hand back something the lock does not describe, which
      # would be a verified environment that was never verified.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            methods/${{ matrix.method }}/requirements.lock.txt
            requirements-tools.lock.txt
      - name: Install from the lock, hash-checked
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r "methods/${{ matrix.method }}/requirements.lock.txt" \
            -r requirements-tools.lock.txt
      - name: Check the environment is the locked one
        run: |
          .venv/bin/python bin/verify-environment.py \
            --lock "methods/${{ matrix.method }}/requirements.lock.txt" \
            --lock requirements-tools.lock.txt
      - name: Run the whole suite
        run: .venv/bin/python -m unittest discover -s tests -v

  # Slower, so it runs before a merge rather than on every push. Built once by
  # hand originally, with nothing re-checking it since.
  container:
    needs: discover
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        method: ${{ fromJSON(needs.discover.outputs.methods) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - name: Build the image
        run: |
          docker build -f "methods/${{ matrix.method }}/Dockerfile" \
            -t "method-image" .
      - name: Check the image is the locked environment
        run: |
          docker run --rm -w /work method-image \
            python3 bin/verify-environment.py \
              --lock "methods/${{ matrix.method }}/requirements.lock.txt" \
              --lock requirements-tools.lock.txt
      # The whole suite, inside the image. That covers the contract chain --
      # resolve, adapt, contract-test -- as the method's own smoke tests run
      # it, rather than a hand-written chain that only ever fitted one method.
      - name: Run the suite inside the image
        run: |
          docker run --rm -w /work method-image \
            python3 -m unittest discover -s tests -v
