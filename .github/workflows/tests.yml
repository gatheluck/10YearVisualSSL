# Everything the pre-commit hook runs, run again where nobody can skip it.
#
# The hook is machinery, but machinery on one machine: it needs
# `git config core.hooksPath .githooks` per clone, `--no-verify` skips it, and
# it only ever tested the platform the committer was using. Every end-to-end
# check before this ran on macOS arm64; the deployment target is linux x86_64.
#
# **Methods are discovered, not listed.** A hand-written matrix is a list, and
# a list goes stale the moment a method is added -- which is how the second
# method arrived with twelve of its tests silently skipping in CI while the
# job still reported success.
#
# Actions are pinned by commit SHA rather than by tag, for the same reason the
# container's base image is pinned by digest: a tag is a moving target, and a
# run that cannot be repeated proves less than it appears to.

name: tests

# **Push builds only the default branch, and that is about cost, not scope.**
# With no filter, a commit on a branch that has an open pull request started
# two runs of the same commit -- one for the push, one for the pull request.
# One full run is about 37 minutes of billed runner time, so that was roughly
# 56 minutes per commit for a suite that takes 15 seconds locally, and the
# account ran out of minutes mid-merge: the jobs then completed in two seconds
# with no steps and no log, which reads exactly like a broken workflow and is
# not one.
#
# Nothing loses coverage. A branch cannot reach `main` except through a pull
# request, and `pull_request` covers that.
on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first, and only the second answer is wanted.
# **The default branch is excluded**: cancelling there would destroy the record
# of whether a merged commit was good, which is the one record worth paying
# for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The claim that the core needs nothing installed, checked on Linux.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: .python-version
      - name: Run the suite with no dependencies installed
        run: ./tests/run-tests.sh

  # Every method that has a lock, found by looking rather than by listing.
  discover:
    runs-on: ubuntu-latest
    outputs:
      methods: ${{ steps.find.outputs.methods }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - id: find
        name: Find the methods that declare a locked environment
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          found = sorted(p.parent.name for p in
                         pathlib.Path("methods").glob("*/requirements.lock.txt"))
          if not found:
              raise SystemExit("no method declares a lock; nothing would run")
          print("methods=" + json.dumps(found))
          PY

  # Each method's locked environment, on the platform it is deployed to, with
  # that method's own tests actually running rather than skipping.
  #
  # Pull-request only, and that is about cost, not scope. A direct push to main
  # is blocked by branch protection, so every change reaches main through a
  # pull request where this whole matrix already ran; re-running it on the
  # merge commit's push cost about 1,631 billed minutes a merge (measured on
  # run 33232401482) to re-test a commit the pull request had just tested. The
  # merge commit differs from the tested head only when main advanced
  # meanwhile, which "require branches up to date before merging" closes. The
  # base suite (`core`) still runs on every push, so main is never wholly
  # unchecked. Guarded by test_a_plain_push_runs_the_base_suite_and_gates_the_
  # dependent_one.
  locked:
    needs: discover
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        method: ${{ fromJSON(needs.discover.outputs.methods) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      # Most of this job is downloading torch, once per method per run.
      # **Keyed on the lock files**, so a changed lock misses the cache: the
      # cache can never hand back something the lock does not describe, which
      # would be a verified environment that was never verified.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            methods/${{ matrix.method }}/requirements.lock.txt
            requirements-tools.lock.txt
      - name: Install from the lock, hash-checked
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r "methods/${{ matrix.method }}/requirements.lock.txt" \
            -r requirements-tools.lock.txt
      - name: Check the environment is the locked one
        run: |
          .venv/bin/python bin/verify-environment.py \
            --lock "methods/${{ matrix.method }}/requirements.lock.txt" \
            --lock requirements-tools.lock.txt
      - name: Run the whole suite
        run: .venv/bin/python -m unittest discover -s tests -v

  # The cross-method downstream tasks (docs/DOWNSTREAM.md) -- ADE20K, COCO, NYUv2,
  # SSv2 -- need pycocotools / h5py / av, which no method carries. In the `locked`
  # matrix their smokes therefore only ever skip (the `needs_*` guards), so this
  # job installs the one downstream environment and runs them for real. Without it
  # "the smoke passes" would be a claim nothing in CI ever checked. No submodules:
  # the smokes build a random tiny timm ViT, they do not touch third_party/.
  downstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      # Keyed on the lock, like the method matrix: a changed lock misses the cache
      # rather than handing back an environment the lock does not describe.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            downstream/requirements.lock.txt
            requirements-tools.lock.txt
      - name: Install the downstream environment, hash-checked
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r downstream/requirements.lock.txt \
            -r requirements-tools.lock.txt
      # The four task smokes, each end to end through its entrypoint and the
      # downstream contract (downstream.contract.verify), on a random tiny ViT and
      # synthetic data -- so the pipeline is exercised while nothing downloads.
      - name: Run the downstream task smokes
        run: |
          PYTHONPATH=. .venv/bin/python -m unittest -v \
            tests.test_downstream_ade20k tests.test_downstream_coco \
            tests.test_downstream_nyuv2 tests.test_downstream_ssv2

  # Slower, so it runs before a merge rather than on every push. Built once by
  # hand originally, with nothing re-checking it since.
  container:
    needs: discover
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        method: ${{ fromJSON(needs.discover.outputs.methods) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - name: Build the image
        run: |
          docker build -f "methods/${{ matrix.method }}/Dockerfile" \
            -t "method-image" .
      - name: Check the image is the locked environment
        run: |
          docker run --rm -w /work method-image \
            python3 bin/verify-environment.py \
              --lock "methods/${{ matrix.method }}/requirements.lock.txt" \
              --lock requirements-tools.lock.txt
      # This method's own smoke, inside the image -- the contract chain
      # (resolve, adapt, contract-test) as that smoke exercises it. Not the
      # whole suite: `locked` already runs `unittest discover` in a venv, and
      # re-running the shared and cross-method tests inside all forty-four
      # images cost about forty minutes an image (measured) for coverage the
      # venv job already had. The image's own reason to exist is narrower --
      # that this method's real deployment image builds, is the locked
      # environment, and its smoke runs inside it.
      #
      # Bound to the matrix value, never a name written here: every method has
      # exactly one tests/test_method_<method>.py, so a method whose smoke
      # module is missing makes this step error rather than skip. The image
      # ships the tree at /work with PYTHONPATH=/work, so the module resolves.
      - name: Run this method's smoke inside the image
        run: |
          docker run --rm -w /work method-image \
            python3 -m unittest -v "tests.test_method_${{ matrix.method }}"
