# DeepCluster step 1: AlexNet-BN + PCA/k-means pseudo-labels (Caron et al.,
# ECCV 2018), the AlexNet path.
#
# These are the paper-target settings -- the recipe, not a result. Nothing here
# has executed a full run; the README says what was and was not exercised. The
# clustering uses faiss (the paper-target backend), so this method is
# GPU / x86_64-linux only. The capture's ViT step 2 is not ported.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: step1
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # model
  sobel: true             # 2-channel Sobel front-end (paper default)
  # data
  crop_size: 224
  # clustering (PCA-whiten + k-means, faiss)
  k: 10000                # number of clusters (paper)
  pca_dim: 256            # PCA output dim before k-means (paper)
  # training (SGD, as in the paper)
  epochs: 500
  batch_size: 256
  feat_batch_size: 256    # feature-extraction batch (no grad)
  num_workers: 8
  lr: 0.05
  momentum: 0.9
  weight_decay: 1.0e-5
  lr_decay_epochs: [200, 400]
  lr_decay_rate: 0.1
