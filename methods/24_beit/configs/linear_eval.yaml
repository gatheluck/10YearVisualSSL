# BEiT linear evaluation: a linear probe on the frozen BEiT backbone.
#
# The probe reads the model this port trains (the BEiT backbone's mean-pooled
# patch tokens, one embed_dim vector per image), so its number is a genuine,
# comparable linear probe. It follows the shared ARSSL protocol (mean-centre +
# L2-normalise features, a single linear layer, SGD + cosine) used by the other
# ported methods, so the number is comparable across them. The BEiT pretrain knobs
# (tokenizer, masking, schedule) are not accepted here.
#
# The backbone dims are named so the frozen trunk can be rebuilt to load
# encoder.pt. The capture's own BEiT eval fine-tunes the ViT end to end; this port
# uses the shared frozen-feature probe instead (a documented deviation).
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt from a pretrain run
# The output path is fixed at --out.
stage: linear_eval
seed: 0
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  # model (the backbone is a fixed BEiT trunk; these dims rebuild it)
  img_size: 224
  patch_size: 16
  vocab_size: 8192
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  drop_path_rate: 0.1
  init_values: 0.1
  # probe: a single linear layer, SGD + cosine
  epochs: 100
  batch_size: 256
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
