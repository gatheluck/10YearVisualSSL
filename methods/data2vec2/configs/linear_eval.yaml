# data2vec2 linear evaluation: a linear probe on the frozen pretrained backbone.
#
# This port is eval-only (see the adapter docstring): data2vec 2.0's as-is
# comparison freezes the official pretrained vision backbone and probes its CLS
# token, and the from-scratch self-distillation pretraining (IN-1k, many GPU-days)
# is the excluded step. The probed representation is a genuine SSL feature -- so
# this number is comparable (the "pretrained-backbone reuse" row, analogous to
# eva02 / DINOv2 / Franca). See docs/EVAL_DOWNLOAD.md.
#
# The model class is transformers' Data2VecVisionModel (a pinned pip dependency),
# not a git submodule. Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set D2V_CKPT=<path>    the official pytorch_model.bin. Obtain it with
#                            `python3 bin/fetch-weights.py --provenance
#                            methods/data2vec2/provenance.json --artifact
#                            backbone_artifact --out <dir>` (it is pinned by
#                            sha256 in provenance.json). Required for a meaningful
#                            number; the hermetic smoke leaves it empty and builds
#                            a random tiny backbone, so its accuracy is meaningless
#                            and only the pipeline runs.
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # backbone: the official data2vec-vision-base (ViT-B/16, 224px) pretraining
  # checkpoint. transformers has no create-model-by-name, so the architecture is
  # given explicitly and the checkpoint is loaded into it.
  name: facebook/data2vec-vision-base
  ckpt: "${D2V_CKPT}"
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  # probe: a single linear layer, SGD + cosine.
  epochs: 100
  batch_size: 32
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
