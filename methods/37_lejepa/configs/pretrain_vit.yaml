# LeJEPA Step 2: unified ViT-B/16 pretraining, from scratch.
#
# The *same* LeJEPA objective, projector, augmentation and timm ViT-B/16 backbone
# as Step 1 -- only the schedule changes (epochs 100->300, lr 5e-4->6e-4, min_lr
# 5e-7->1e-6) and milestone checkpoints are written at 100/200/300. Selected by
# `recipe: unified` (absent == the native paper recipe, byte-for-byte unchanged).
# The backbone is already vit_base_patch16_224, so this is a recipe/milestone
# alignment; timm is already a dependency (no lock change).
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
#
#   python3 bin/launch.py --config methods/37_lejepa/configs/pretrain_vit.yaml \
#       --method 37_lejepa --set DATA_ROOT=/path/to/imagenet
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  recipe: unified
  # model (build_lejepa): a timm ViT-B/16 backbone + a projection MLP
  name: vit_base_patch16_224
  img_size: 224
  drop_path_rate: 0.1
  proj_hidden_dim: 2048
  proj_dim: 512
  proj_layers: 3
  final_bn: true
  # augmentation (multi-view SSL crops)
  views: 4
  crop_scale: [0.08, 1.0]
  color_jitter: [0.8, 0.8, 0.8, 0.2]
  color_jitter_p: 0.8
  grayscale_p: 0.2
  blur_p: 0.5
  blur_kernel: 23
  solarize_p: 0.2
  hflip_p: 0.5
  # data
  num_workers: 8
  # LeJEPA objective: loss = SIGReg * lambda + invariance * (1 - lambda)
  lambda: 0.02
  sigreg_t_max: 3.0
  sigreg_knots: 17
  sigreg_num_slices: 256
  sigreg_seed: 12345
  # training: AdamW + linear warmup then cosine decay to min_lr (unified recipe)
  epochs: 300
  batch_size: 1024
  lr: 6.0e-4
  min_lr: 1.0e-6
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  weight_decay: 5.0e-2
  warmup_epochs: 10
  clip_grad: 0.0
  save_at_epochs: [100, 200, 300]
