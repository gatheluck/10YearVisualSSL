# LeJEPA linear evaluation: a linear probe on the frozen backbone.
#
# The probe reads the model this port trains (the LeJEPA backbone's num_features
# feature, one vector per image), so its number is a genuine, comparable linear
# probe. It follows the shared ARSSL protocol (mean-centre + L2-normalise
# features, a single linear layer, SGD + cosine) used by the other ported methods,
# so the number is comparable across them. The LeJEPA step-1 knobs (views, SIGReg,
# lambda, schedule) are not accepted here.
#
# The backbone name + dims are named so the frozen trunk can be rebuilt to load
# encoder.pt. The capture's own LeJEPA eval fits a LayerNorm+Linear head; this port
# uses the shared frozen-feature probe instead (a documented deviation).
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt from a step-1 run
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  # model (the backbone is a fixed timm model; these rebuild it)
  name: vit_base_patch16_224
  img_size: 224
  drop_path_rate: 0.1
  # probe: a single linear layer, SGD + cosine
  epochs: 100
  batch_size: 256
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
