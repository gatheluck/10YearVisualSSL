# MoCo v3 Step 2: unified ViT-B/16 pretraining, from scratch.
#
# The *same* MoCo v3 objective (symmetric InfoNCE, momentum key encoder), ViT-B/16
# backbone, projector and predictor as Step 1 -- only the recipe changes to the
# unified one: direct lr 6e-4 (Step 1 uses learning_rate = base LR x batch/256), a
# FIXED EMA momentum (Step 1 cosine-anneals it to 1.0), gradient clipping, and the
# unified schedule (epochs 300, batch 1024, wd 0.05, 10-epoch warmup); milestone
# checkpoints at 100/200/300. Selected by `recipe: unified` (absent == the native
# paper recipe, byte-for-byte unchanged). timm supplies the ViT (built from
# scratch), already a dependency, so no lock change.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
#
#   python3 bin/launch.py --config methods/22_mocov3/configs/pretrain_vit.yaml \
#       --method 22_mocov3 --set DATA_ROOT=/path/to/imagenet
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  recipe: unified
  # model (build_mocov3_vit): ViT-Base + 3-layer MLP projector + 2-layer predictor
  arch: vit_base
  proj_dim: 256
  mlp_dim: 4096
  stop_grad_conv1: true
  img_size: 224
  # data
  crop_min: 0.08
  # mocov3: temperature + EMA momentum (FIXED for the unified recipe)
  temperature: 0.2
  momentum: 0.99
  # training: AdamW (betas 0.9, 0.95) + per-iter cosine LR with warmup (unified)
  epochs: 300
  batch_size: 1024
  num_workers: 8
  lr: 6.0e-4                # unified: 1.5e-4 * batch_size / 256 for batch 1024
  min_lr: 1.0e-6
  weight_decay: 0.05
  warmup_epochs: 10
  betas: [0.9, 0.95]
  clip_grad: 3.0
  save_at_epochs: [100, 200, 300]
