# Context Encoder step 1: AlexNet inpainting on ImageNet-1k
# (Pathak et al., arXiv:1604.07379).
#
# These are the settings the captured cluster run used -- the recipe, not a
# result. Nothing here has executed a full run; the method README says exactly
# what was and was not exercised.
#
# The data path is not in this file: pass it with `--set DATA_ROOT=<path>`, and
# the loader reads `<path>/train`. The output path is not here either; the
# contract fixes it at `--out`.
stage: step1
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  epochs: 300
  batch_size: 128
  num_workers: 8
  lr: 1.0e-3
  momentum: 0.9
  weight_decay: 5.0e-4
  warmup_epochs: 10
  img_size: 227
  mask_size: 128
  loss_type: l2
  use_adversarial: true
  adversarial_weight: 0.001
  save_freq: 100
  print_freq: 100
