# EVA-02 linear evaluation: a linear probe on the frozen pretrained backbone.
#
# This port is eval-only (see the adapter docstring): EVA-02's as-is comparison
# freezes the official masked-image-modelling pretrained backbone and probes its
# pooled feature, and the from-scratch MIM pretraining (IN-22k, many GPU-days) is
# the excluded step. The probed representation is a genuine SSL feature -- so this
# number is comparable (the "pretrained-backbone reuse" row, analogous to
# DINOv2 / Franca). See docs/EVAL_DOWNLOAD.md.
#
# The model class is timm's (a pinned pip dependency), not a git submodule. Two
# paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>    an ImageFolder with train/ and val/ subdirectories
#   --set EVA02_CKPT=<path>   the official pytorch_model.bin. Obtain it with
#                             `python3 bin/fetch-weights.py --provenance
#                             methods/eva02/provenance.json --artifact
#                             backbone_artifact --out <dir>` (it is pinned by
#                             sha256 in provenance.json). Required for a
#                             meaningful number; the hermetic smoke leaves it
#                             empty and builds a random tiny backbone, so its
#                             accuracy is meaningless and only the pipeline runs.
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # backbone: the official EVA-02-B/14 (patch 14, 224px) MIM-IN22k recipe.
  name: eva02_base_patch14_224.mim_in22k
  ckpt: "${EVA02_CKPT}"
  img_size: 224
  patch_size: 14
  embed_dim: 768
  depth: 12
  num_heads: 12
  # probe: a single linear layer, SGD + cosine.
  epochs: 100
  batch_size: 32
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
