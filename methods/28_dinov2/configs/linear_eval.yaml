# DINOv2 linear evaluation: a linear probe on the frozen pretrained backbone.
#
# This port has no step 1 (see the adapter docstring): in the capture, DINOv2's
# "Step 1" is this frozen-backbone probe, and the from-scratch SSL pretraining on
# the unavailable LVD-142M is the excluded step. The probe reads DINOv2's official
# pretrained ViT-g/14 CLS token, a genuine SSL representation -- so this number is
# comparable (the "pretrained-backbone reuse" row, like 36_franca). See
# docs/EVAL_DOWNLOAD.md.
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>    an ImageFolder with train/ and val/ subdirectories
#   --set DINOV2_CKPT=<path>  the official dinov2_vitg14_pretrain.pth. Obtain it
#                             with `python3 bin/fetch-weights.py --provenance
#                             methods/28_dinov2/provenance.json --section
#                             backbone_artifact --out <dir>` (it is pinned by
#                             sha256 in provenance.json). Required for a
#                             meaningful number; the hermetic smoke leaves it
#                             empty and builds a random backbone, so its accuracy
#                             is meaningless and only the pipeline runs.
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # backbone (third_party/dinov2): the official ViT-g/14 LVD-142M recipe.
  name: dinov2_vitg14
  ckpt: "${DINOV2_CKPT}"
  resolution: 224
  feature_key: x_norm_clstoken
  # probe: a single linear layer, SGD + cosine.
  epochs: 100
  batch_size: 32
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
