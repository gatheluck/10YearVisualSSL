# VAR step 1: next-scale autoregressive pretraining
# (Tian et al., arXiv:2404.02905), the VAR-d16 recipe.
#
# These are the settings the upstream recipe uses -- the recipe, not a result.
# Nothing here has executed a full run; the method README says exactly what was
# and was not exercised.
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder of training images
#   --set VQVAE_CKPT=<path>  the pretrained VQVAE tokeniser (a download). It is
#                            required for a real run; the hermetic smoke leaves
#                            it empty and builds a tiny random VQVAE instead.
# The output path is not here either; the contract fixes it at --out.
stage: step1
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # model (build_vae_var): the architecture, so load_encoder can rebuild it
  patch_nums: [1, 2, 3, 4, 5, 6, 8, 10, 13, 16]
  vocab_size: 4096
  Cvae: 32
  ch: 160
  num_classes: 1000
  depth: 16
  shared_aln: false
  attn_l2_norm: true
  # training
  epochs: 200
  batch_size: 256
  num_workers: 8
  lr: 1.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  vqvae_ckpt: "${VQVAE_CKPT}"
