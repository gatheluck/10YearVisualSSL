# CMC step 1: two-branch AlexNet + NCE memory bank (Tian et al., 2019;
# arXiv:1906.05849), the paper-faithful AlexNet path.
#
# These are the paper-target settings -- the recipe, not a result. Nothing here
# has executed a full run; the README says what was and was not exercised. The
# capture's deprecated ResNet variant and its ViT step 2 are not ported.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder of training images
# The output path is fixed at --out.
stage: step1
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # model (build_cmc_from_config): L2-normalised feat_dim-d embedding per view
  feat_dim: 128
  img_size: 224
  # NCE (two memory banks, cross-view)
  temperature: 0.07       # T (paper Section 3)
  nce_momentum: 0.5       # memory-bank EMA momentum m
  num_negatives: 16384    # K negatives per positive
  # data augmentation
  crop_low: 0.2           # RandomResizedCrop scale=(0.2, 1.0)
  # training (SGD, as in the paper)
  epochs: 240
  batch_size: 128
  num_workers: 8
  lr: 0.03
  momentum: 0.9           # SGD momentum
  weight_decay: 1.0e-4
  lr_decay_epochs: [120, 160, 200]
  lr_decay_rate: 0.1
