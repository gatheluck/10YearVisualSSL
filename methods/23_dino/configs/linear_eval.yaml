# DINO linear evaluation: a linear probe on the frozen teacher ViT backbone.
#
# The probe reads the model this port trains (the teacher ViT's CLS feature, one
# embed_dim vector per image), so its number is a genuine, comparable linear
# probe. It follows the shared ARSSL protocol (mean-centre + L2-normalise
# features, a single linear layer, SGD + cosine) used by the other ported
# methods, so the number is comparable across them. The DINO pretrain knobs (head
# dims, temperatures, teacher momentum, multi-crop) are not accepted here.
#
# The capture's own DINO linear eval concatenates the last-4 blocks' CLS tokens
# and trains a distributed head; this port uses the shared single-feature probe
# instead (a documented deviation, the same as every other port).
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt from a pretrain run
# The output path is fixed at --out.
stage: linear_eval
seed: 0
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  # model (the backbone is a fixed ViT trunk; arch + img_size name it)
  arch: vit_small
  img_size: 224
  # probe: a single linear layer, SGD + cosine
  epochs: 100
  batch_size: 256
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
