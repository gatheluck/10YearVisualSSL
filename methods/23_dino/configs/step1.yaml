# DINO step 1: ViT-S/16 + EMA teacher + self-distillation (Caron et al., 2021;
# arXiv:2104.14294), the official ViT-S/16 path.
#
# These are the paper-target settings (Appendix A) -- the recipe, not a result.
# Nothing here has executed a full run; the README says what was and was not
# exercised. DINO ships its own ViT (no timm) and builds it from scratch, so the
# run is torch-only and hermetic. The capture's step 2 (ViT-B) is not ported.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: step1
seed: 0
data_root: "${DATA_ROOT}"
device: auto

train:
  # model (build_dino): ViT-S/16; img_size is the ViT base / global crop size
  arch: vit_small
  img_size: 224
  # DINO head + multi-crop + temperatures + teacher EMA base
  out_dim: 65536
  hidden_dim: 2048
  bottleneck_dim: 256
  use_bn_in_head: false
  norm_last_layer: true
  n_local_crops: 8            # 8 local + 2 global = 10 crops total
  local_size: 96
  global_crops_scale: [0.4, 1.0]
  local_crops_scale: [0.05, 0.4]
  student_temp: 0.1
  teacher_temp_init: 0.04     # vanilla 100ep ViT-S keeps teacher temp fixed
  teacher_temp_final: 0.04
  teacher_temp_warmup_epochs: 0
  momentum_teacher: 0.996     # EMA momentum start (cosine schedule to 1.0)
  # training (AdamW + per-iter cosine LR with warmup; cosine weight decay)
  epochs: 100
  batch_size: 1024
  num_workers: 8
  drop_path_rate: 0.1
  lr: 2.0e-3                  # 0.0005 * batch_size / 256 for batch 1024
  min_lr: 1.0e-6
  warmup_epochs: 10
  weight_decay_start: 0.04
  weight_decay_end: 0.4
  clip_grad: 3.0
  freeze_last_layer: 1        # freeze the head's last layer for the first epoch
