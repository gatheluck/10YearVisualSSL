# SeLa step 1: ResNet + Sinkhorn-Knopp self-labelling (Asano et al., ICLR 2020;
# arXiv:1911.05371), the ResNet path aligned to yukimasano/self-label.
#
# These are the paper-target settings -- the recipe, not a result. Nothing here
# has executed a full run; the README says what was and was not exercised. The
# capture's ViT step 2 (which needs timm) is not ported.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: step1
seed: 31
data_root: "${DATA_ROOT}"
device: auto

train:
  # model (create_resnet_sela): ResNetV2-50 backbone + linear prototype heads
  arch: resnetv2
  image_size: 224
  # clustering (Sinkhorn-Knopp optimal transport)
  k: 3000                 # clusters per head
  num_heads: 10           # independent prototype heads
  nopts: 100              # scheduled label optimisations
  sinkhorn_max_iters: 1000
  sinkhorn_tol: 0.1
  lambda: 25              # softmax power in the OT objective
  epsilon: 0.04           # fallback if lambda is unset
  # training (SGD + step LR)
  epochs: 400
  batch_size: 256
  num_workers: 16
  learning_rate: 0.08
  momentum: 0.9
  weight_decay: 1.0e-5
  lr_schedule: step
  lr_step_size: 150
  lr_gamma: 0.1
  temperature: 1.0
  assignment_mode: hard
