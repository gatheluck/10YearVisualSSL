# V-JEPA step 2 (image adaptation): ViT-B/16 latent prediction on ImageNet-1k
# (Bardes et al., 2024; arXiv:2404.08471), the capture's unified-comparison setting.
#
# These are the paper-target settings -- the recipe, not a result. Nothing here has
# executed a full run; the README says what was and was not exercised. The ViT +
# predictor + mask collator are the pinned upstream (third_party/jepa), imported not
# copied, run at num_frames=1 so the backbone is an image ViT-B/16. The capture's
# step 1 (a caveat probe of the released VIDEO ViT-H/16) is not ported.
#
# Licence: the jepa code is CC BY-NC 4.0 (non-commercial). This port is for academic
# research only; see provenance.json and README.md.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: pretrain
seed: 0
data_root: "${DATA_ROOT}"
device: auto

train:
  # model (init_video_model): image ViT-B/16 (num_frames=1) + predictor
  model_name: vit_base
  crop_size: 224
  patch_size: 16
  num_frames: 1
  tubelet_size: 1
  pred_depth: 6
  pred_embed_dim: 384
  uniform_power: false
  use_mask_tokens: true
  zero_init_mask_tokens: true
  use_sdpa: true
  # data
  num_workers: 8
  use_color_jitter: true
  # mask (3D multi-block; 2D at num_frames=1): one small-block set + one large block
  mask:
    - aspect_ratio: [0.75, 1.5]
      num_blocks: 4
      spatial_scale: [0.15, 0.20]
      temporal_scale: [1.0, 1.0]
      max_temporal_keep: 1.0
      max_keep:
    - aspect_ratio: [0.75, 1.5]
      num_blocks: 1
      spatial_scale: [0.70, 0.85]
      temporal_scale: [1.0, 1.0]
      max_temporal_keep: 1.0
      max_keep:
  # loss
  loss_exp: 1.0
  reg_coeff: 0.0
  # training (AdamW + warmup->cosine LR; EMA target 0.996 -> 1.0)
  epochs: 300
  batch_size: 1024
  lr: 6.0e-4
  start_lr: 0.0
  final_lr: 1.0e-6
  weight_decay: 0.05
  final_weight_decay: 0.05
  warmup_epochs: 10
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  clip_grad: 10.0
  ema_start: 0.996
  ema_final: 1.0
