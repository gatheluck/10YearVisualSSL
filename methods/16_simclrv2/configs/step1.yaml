# SimCLR v2 step 1: ResNet-50 + 3-layer MLP head + NT-Xent + LARS (Chen et al.,
# 2020; arXiv:2006.10029), the paper-faithful ResNet-50 path.
#
# These are the paper-target settings -- the recipe, not a result. Nothing here
# has executed a full run; the README says what was and was not exercised. The
# capture's ViT step 2 (which needs timm) is not ported.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: step1
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # model (build_resnet_simclrv2): ResNet-50 + 3-layer MLP head (2048->2048->
  # 2048->out_dim). width_multiplier 1 = ResNet-50; 2 = wide_resnet50_2.
  out_dim: 128
  img_size: 224
  width_multiplier: 1
  color_jitter_strength: 1.0
  # loss (NT-Xent)
  temperature: 0.1        # tau -- SimCLR v2 (Appendix B.1); v1 used 0.07
  # training (LARS + cosine schedule with linear warmup)
  epochs: 800             # SimCLR v2 ResNet-50 recipe
  batch_size: 4096
  num_workers: 8
  lr: 4.8                 # 0.3 * batch_size / 256
  momentum: 0.9
  weight_decay: 1.0e-4
  eta: 0.001              # LARS trust coefficient
  warmup_epochs: 10
