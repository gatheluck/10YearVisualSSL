# AIM step 2 (unified ViT-B/16): the "A Decade of Visual SSL" Step-2 recipe.
#
# The from-scratch unified Step 2. It trains an AIM ViT-B/16 on ImageNet-1k with
# the prefix-LM next-patch objective (per-patch normalised pixels, MSE), 300
# epochs, batch 1024, lr 6e-4, betas (0.9, 0.95), weight decay 0.05, grad clip 1.0,
# cosine LR with 10-epoch warmup, with milestone checkpoints at 100/200/300. This
# is a different comparison from the eval-only Step-1 (configs/linear_eval.yaml),
# which probes the official downloaded AIM-600M -- the from-scratch Step 2 removes
# the data confound (every method trains on ImageNet-1k here).
#
# The Step-2 model is the lab's OWN from-scratch AIM re-implementation
# (models/aim_vit.py, torch-only); it uses no apple code or weights, so the
# apple-amlr non-commercial licence binds only the Step-1 as-is probe.
#
# These are the settings the captured cluster run used -- the recipe, not a
# result. Nothing here has executed a full run; the README says exactly what was
# and was not exercised.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

model:
  name: aim_base_patch16
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  head_depth: 12                # AIM prediction head: 12 residual MLP blocks
  head_dim: 2048
  prefix_fraction_min: 0.10
  prefix_fraction_max: 0.50

data:
  num_workers: 8

training:
  epochs: 300
  batch_size: 1024
  lr: 6.0e-4
  min_lr: 0.0
  warmup_epochs: 10
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.05
  grad_clip: 1.0
  save_at_epochs: [100, 200, 300]
