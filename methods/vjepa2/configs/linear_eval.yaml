# vjepa2 linear evaluation: a linear probe on the frozen pretrained backbone.
#
# This port is eval-only (see the adapter docstring): V-JEPA 2's as-is comparison
# freezes the pretrained video encoder and probes its mean-pooled patch tokens, and
# the latent-prediction video pretraining (internet-scale video, many GPU-days) is
# the excluded step. The probed representation is a genuine SSL feature -- so this
# number is comparable (the "pretrained-backbone reuse" row, analogous to eva02 /
# aimv2 / data2vec2 / cae / videomae). See docs/EVAL_DOWNLOAD.md.
#
# The model is a small self-contained V-JEPA 2 ViT in evaluate_linear_vjepa2.py,
# not a git submodule and not a pip model class. Two paths are passed at run time,
# not shipped:
#   --set DATA_ROOT=<path>       an ImageFolder with train/ and val/ subdirectories
#   --set VJEPA2_CKPT=<path>     the official facebook/vjepa2-vitl-fpc64-256
#                                checkpoint. Obtain it with `python3
#                                bin/fetch-weights.py --provenance
#                                methods/vjepa2/provenance.json --artifact
#                                backbone_artifact --out <dir>` (pinned by sha256
#                                in provenance.json). Required for a meaningful
#                                number; the hermetic smoke leaves it empty and
#                                builds a random tiny backbone, so its accuracy is
#                                meaningless and only the pipeline runs.
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # backbone: the official facebook/vjepa2-vitl-fpc64-256 (ViT-L/16, tubelet 2,
  # native 256px). The architecture is given explicitly and the checkpoint's
  # encoder.* tensors are loaded into the self-contained ViT; predictor.* dropped.
  name: facebook/vjepa2-vitl-fpc64-256
  ckpt: "${VJEPA2_CKPT}"
  img_size: 256
  patch_size: 16
  embed_dim: 1024
  depth: 24
  num_heads: 16
  num_frames: 16
  tubelet_size: 2
  # probe: a single linear layer, SGD + cosine.
  epochs: 100
  batch_size: 32
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
