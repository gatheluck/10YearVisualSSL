# iBOT linear evaluation: frozen ViT-Small/16 teacher backbone on ImageNet-1k.
#
# The second stage freezes the encoder step 1 produced and fits a linear
# classifier on real labels. These are the numbers this project compares.
#
# The encoder to evaluate is `encoder.pt` from a pretrain run: pass it with
# `--set ENCODER=<path>/encoder.pt`. The data path is `--set DATA_ROOT=<path>`
# (the evaluation reads `<path>/train` and `<path>/val`). The output path is
# `--out`. The teacher and the online protocol are fixed by the adapter, not
# settings here.
#
# iBOT's official ViT-S recipe probes the teacher with the last four blocks'
# CLS tokens concatenated (a 4x-wide, multi-layer feature). This port uses the
# single canonical final feature instead -- n_last_blocks=1, so the feature is
# the last block's CLS token (embed_dim, 384-d for vit_small). This follows
# BASIC5_FAIR_v1 rule d ("one canonical final feature layer; do not search
# layers or concatenate features from multiple layers") and matches the
# single-feature policy already documented for 23_dino. It is a deliberate,
# documented deviation from iBOT's published recipe, taken for comparability
# across the ported methods (see docs/BASIC5_PROTOCOL.md).
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

model:
  arch: vit_small
  patch_size: 16
  n_last_blocks: 1
  avgpool_patchtokens: 0

eval:
  epochs: 100
  batch_size: 256
  lr: 1.0e-3
  num_workers: 8
