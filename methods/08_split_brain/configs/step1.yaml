# Split-Brain Autoencoder step 1: two cross-channel AlexNets (Zhang, Isola &
# Efros, CVPR 2017), the AlexNet path.
#
# The recipe, not a result. Nothing here has executed a full run; the README says
# what was and was not exercised. The capture ships no AlexNet step-1 recipe (its
# train.py trains the ViT step 2), so the optimiser knobs below are the port's
# single-process choice (a plain Adam). The captured ViT step 2 is not ported.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: step1
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # data
  crop_size: 224
  # training (Adam -- the port's single-process choice; see the note above)
  epochs: 200
  batch_size: 256
  num_workers: 8
  lr: 1.0e-3
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.0
  lr_decay_epochs: [120, 160]
  lr_decay_rate: 0.1
