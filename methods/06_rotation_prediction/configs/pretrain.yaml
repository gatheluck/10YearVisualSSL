# Rotation step 1: rotation-classification pretext (Gidaris et al., ICLR 2018;
# arXiv:1803.07728), the AlexNet-BN recipe.
#
# These are the settings the recipe uses -- the recipe, not a result. Nothing
# here has executed a full run; the README says what was and was not exercised.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # model / data (build_alexnet_rotation_model + RotationDataset)
  num_classes: 4        # the four rotations: 0, 90, 180, 270 degrees
  image_size: 224       # standard ImageNet crop
  # training (SGD + step decay, as in the paper)
  epochs: 50
  batch_size: 192       # original images; the collate expands to four rotations
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
