# Rotation linear evaluation: a linear probe on the frozen AlexNet-BN encoder.
#
# The probe reads the model this port trains (the AlexNet-BN encoder, one 4096-d
# feature per image), so its number is a genuine, comparable linear probe.
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt from a step-1 run
# The output path is fixed at --out. The model settings must match the step-1 run
# that produced ENCODER.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  # model (must match the step-1 run so encoder.pt loads)
  num_classes: 4
  image_size: 224
  # probe: a single linear layer, SGD + cosine
  epochs: 90
  batch_size: 256
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
