# Rotation Step 2: unified ViT-B/16 rotation pretraining, from scratch.
#
# The capture's paper axis compares every method on ONE backbone -- a ViT-B/16
# trained from scratch (timm's VisionTransformer), differing only in the SSL
# objective. Here that objective is the 4-way rotation pretext on the CLS token.
# Faithful to the capture's methods/6_rotation_prediction/train_step2_vit.py:
# AdamW, a linear warmup then cosine decay to min_lr, gradient clipping, mixed
# precision (CUDA only), and checkpoints at save_at_epochs -- 100/200/300 -- so
# the ImageNet linear probe can be run per milestone (the CSV's Step-2 sweep).
# The native AlexNet pretrain (configs/pretrain.yaml, no `arch`) is unchanged.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
#
#   python3 bin/launch.py --config methods/06_rotation_prediction/configs/pretrain_vit.yaml \
#       --method 06_rotation_prediction --set DATA_ROOT=/path/to/imagenet
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # arch selects the ViT Step-2 path; absent / alexnet is the native pretrain.
  arch: vit
  # model (build_vit_rotation_model): timm ViT-B/16, 4-way rotation head on CLS.
  num_classes: 4        # the four rotations: 0, 90, 180, 270 degrees
  image_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  drop_rate: 0.1
  attn_drop_rate: 0.0
  # training: AdamW + cosine (10-epoch warmup) to min_lr, AMP, grad clip.
  epochs: 300
  batch_size: 1024      # original images; the collate expands to four rotations
  num_workers: 8
  lr: 0.0006            # 1.5e-4 x (batch_size / 256)
  weight_decay: 0.05
  betas: [0.9, 0.999]
  warmup_epochs: 10
  min_lr: 1.0e-6
  clip_grad: 1.0
  save_at_epochs: [100, 200, 300]
