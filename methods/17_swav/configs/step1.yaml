# Step 1: SwAV pretraining with a ResNet-50 backbone.
# Caron, Misra, Mairal, Goyal, Bojanowski and Joulin, "Unsupervised Learning
# of Visual Features by Contrasting Cluster Assignments", 2020
# (arXiv:2006.09882).
#
# The values are the ones the captured cluster runs used.
#
# **No data path and no output path here.** The captured config named an
# absolute path on the cluster for both.
#
# **Every setting is declared, including the ones the original treats as
# optional.** The trainer reads a dozen keys with a default behind them; a
# config that left them out would describe a run whose Sinkhorn epsilon,
# warmup and prototype freezing were whatever the code defaulted to that day.
#
#   python3 bin/launch.py --config methods/17_swav/configs/step1.yaml \
#       --method 17_swav --set DATA_ROOT=/path/to/imagenet

stage: step1

seed: 42

data_root: "${DATA_ROOT}"

device: auto

train:
  epochs: 100
  batch_size: 256
  num_workers: 8
  lr: 0.6
  final_lr: 0.0006
  momentum: 0.9
  weight_decay: 1.0e-6
  warmup_epochs: 10
  start_warmup: 0.0
  # LARC settings.
  eta: 0.001
  larc_clip: true
  # The prototypes are held still for the first steps, so the assignment has
  # something stable to point at.
  freeze_prototypes_steps: 313

  # **Multi-crop: four parallel lists, one entry per crop size.** Two large
  # crops and six small ones, as the paper uses. They must be the same length;
  # the adapter refuses them if they are not.
  size_crops: [224, 96]
  nmb_crops: [2, 6]
  min_scale_crops: [0.14, 0.05]
  max_scale_crops: [1.0, 0.14]
  color_jitter_strength: 1.0

  # The Sinkhorn-Knopp assignment.
  temperature: 0.1
  sinkhorn_eps: 0.05
  sinkhorn_iters: 3

  out_dim: 128
  hidden_mlp: 2048
  nmb_prototypes: 3000

  save_freq: 50
  print_freq: 100
