# SwAV linear evaluation: frozen ResNet-50 backbone on ImageNet-1k.
#
# The second stage freezes the encoder step 1 produced and fits a linear
# classifier on real labels. These are the numbers this project compares.
#
# The encoder to evaluate is `encoder.pt` from a pretrain run: pass it with
# `--set ENCODER=<path>/encoder.pt`. The data path is `--set DATA_ROOT=<path>`
# (the evaluation reads `<path>/train` and `<path>/val`). The output path is
# `--out`. `out_dim`/`hidden_mlp`/`nmb_prototypes` are declared because the
# encoder is not self-describing; they must match the pretrain run that produced
# it. `model_type` (resnet) is fixed by the adapter.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  epochs: 100
  batch_size: 256
  lr: 0.3
  weight_decay: 1.0e-6
  num_workers: 8
  img_size: 224
  out_dim: 128
  hidden_mlp: 2048
  nmb_prototypes: 3000
