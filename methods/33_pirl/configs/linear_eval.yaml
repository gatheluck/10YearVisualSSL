# PIRL linear evaluation: a linear probe on the frozen ResNet-50 trunk.
#
# The probe reads the model this port trains (the ResNet-50 trunk, one 2048-d
# avg-pooled feature per image), so its number is a genuine, comparable linear
# probe. It follows the shared ARSSL protocol (mean-centre + L2-normalise
# features, a single linear layer, SGD + cosine) used by the other ported methods,
# so the number is comparable across them. The PIRL pretrain knobs (jigsaw, NCE,
# memory bank) are not accepted here.
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt from a pretrain run
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  # model (the backbone is a fixed ResNet-50; arch names it)
  arch: resnet50
  image_size: 224
  # probe: a single linear layer, SGD + cosine
  epochs: 100
  batch_size: 256
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
