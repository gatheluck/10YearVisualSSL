# PIRL Step 2: unified ViT-B/16 pretraining, from scratch.
#
# The capture's Step-2 backbone is the same ViT-B/16 for every method; PIRL plugs
# in the jigsaw pretext + a momentum memory bank: the ViT encodes both the image
# and its jigsaw view (the nine shuffled patches reassembled into one image and
# resized to the ViT input), and the loss is the weighted sum of the image-NCE
# and jigsaw-NCE against the bank. The CLS token feeds a Linear(768, feature_dim)
# projection, L2-normalised. Optimiser AdamW (betas 0.9, 0.95), linear warmup
# then cosine to min_lr, gradient clipping; checkpoints at 100/200/300. The bank
# is re-seeded from the model each run (initialize_from_model). The native
# ResNet-50 pretrain (configs/pretrain.yaml, arch: resnet50) is unchanged.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
#
#   python3 bin/launch.py --config methods/33_pirl/configs/pretrain_vit.yaml \
#       --method 33_pirl --set DATA_ROOT=/path/to/imagenet
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  arch: vit
  # ViT-B/16 (build_vit_pirl) + Linear(768, feature_dim) projection
  feature_dim: 128
  num_patches: 9
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  drop_rate: 0.0
  attn_drop_rate: 0.0
  # data (jigsaw view)
  image_size: 224
  jigsaw_resize: 256
  jigsaw_crop_size: 255
  jigsaw_grid_size: 3
  jigsaw_patch_size: 64
  num_workers: 8
  # NCE memory bank
  temperature: 0.07
  nce_momentum: 0.5
  num_negatives: 32000
  # loss / memory
  jigsaw_weight: 0.5
  initialize_from_model: true
  # training: AdamW (betas 0.9, 0.95) + cosine (10-epoch warmup) to min_lr, clip
  epochs: 300
  batch_size: 1024
  lr: 0.0006
  weight_decay: 0.05
  warmup_epochs: 10
  min_lr: 1.0e-6
  clip_grad: 3.0
  save_at_epochs: [100, 200, 300]
