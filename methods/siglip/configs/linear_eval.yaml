# SigLIP linear evaluation: a linear probe on the frozen pretrained image tower.
#
# This port is eval-only (see the adapter docstring): SigLIP's as-is comparison
# freezes the official sigmoid-loss image-text pretrained image tower and probes
# its pooled image embedding, and the from-scratch pretraining (the WebLI
# image-text corpus, many TPU-days) is the excluded step. The probed
# representation is a genuine learned feature -- so this number is comparable (the
# multimodal "pretrained-backbone reuse" row, the SigLIP sibling of 38_clip). See
# docs/EVAL_DOWNLOAD.md.
#
# The model class is timm's (a pinned pip dependency), not a git submodule. Two
# paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>     an ImageFolder with train/ and val/ subdirectories
#   --set SIGLIP_CKPT=<path>   the official pytorch_model.bin. Obtain it with
#                              `python3 bin/fetch-weights.py --provenance
#                              methods/siglip/provenance.json --artifact
#                              backbone_artifact --out <dir>` (it is pinned by
#                              sha256 in provenance.json). Required for a
#                              meaningful number; the hermetic smoke leaves it
#                              empty and builds a random tiny backbone, so its
#                              accuracy is meaningless and only the pipeline runs.
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # backbone: the official ViT-B/16 SigLIP (patch 16, 224px) WebLI recipe.
  name: vit_base_patch16_siglip_224.webli
  ckpt: "${SIGLIP_CKPT}"
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  # probe: a single linear layer, SGD + cosine.
  epochs: 100
  batch_size: 32
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
