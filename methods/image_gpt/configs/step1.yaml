# image_gpt step 1: generative pretraining from pixels (Chen et al., 2020;
# arXiv:2006.14671), the iGPT-S recipe.
#
# These are the settings the recipe uses -- the recipe, not a result. Nothing
# here has executed a full run; the README says what was and was not exercised.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is not here; the contract fixes it at --out. The colour
# clusters are fit from DATA_ROOT during the run and saved beside encoder.pt.
stage: step1
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # model (build_igpt): the architecture, so load_encoder can rebuild it.
  vocab_size: 512        # colour clusters
  img_size: 32
  n_layer: 24
  n_head: 8
  n_embd: 512
  # training
  epochs: 300
  batch_size: 64
  num_workers: 8
  lr: 3.0e-4
  grad_clip: 1.0
