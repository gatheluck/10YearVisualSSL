# image_gpt linear evaluation: a linear probe on the trained iGPT.
#
# Unlike the generative ports, the probe reads the model this port trains
# (IGPT.extract_features -- a middle transformer layer, mean-pooled), so its
# number is a genuine, comparable linear probe.
#
# Three paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt from a step-1 run
#   --set CLUSTERS=<path>    clusters.npy from that same step-1 run (the probe
#                            must quantise with the clusters the model was
#                            trained on)
# The output path is not here; the contract fixes it at --out. The architecture
# must match the step-1 run that produced ENCODER.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"
clusters: "${CLUSTERS}"

train:
  # model (must match the step-1 run)
  vocab_size: 512
  img_size: 32
  n_layer: 24
  n_head: 8
  n_embd: 512
  # probe (ARSSL imagenet100 recipe): a single linear layer, SGD + cosine.
  epochs: 100
  batch_size: 256
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
