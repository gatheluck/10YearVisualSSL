# I-JEPA step 2 (unified ViT-B/16): the "A Decade of Visual SSL" Step-2 recipe.
#
# The additive unified path (recipe: unified, in `train`). It plugs the same
# I-JEPA objective into ViT-Base/16 -- 300 epochs, batch 1024, a direct lr 6e-4
# (= 1.5e-4 x 1024/256, used as-is; the trainer does not rescale it), a fixed
# weight decay 0.05 (weight_decay == final_wd, so the cosine is constant),
# 10-epoch warmup, augmentation: step2 (crop + flip + ColorJitter), with milestone
# checkpoints at 100/200/300. The native step-1 recipe (configs/pretrain.yaml,
# ViT-H/14) is left unchanged; absent `recipe` selects it.
#
# These are the settings the captured cluster run used -- the recipe, not a
# result. Nothing here has executed a full run; the README says exactly what was
# and was not exercised.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  recipe: unified
  # model (context/target encoder)
  name: vit_base               # ViT-B/16: embed_dim=768, depth=12, heads=12
  img_size: 224
  patch_size: 16
  # predictor (narrow ViT)
  pred_dim: 192
  pred_depth: 6
  # data
  augmentation: step2          # crop + flip + ColorJitter (unified)
  num_workers: 10
  # multi-block masking (same as original I-JEPA)
  num_enc_masks: 1
  num_pred_masks: 4
  allow_overlap: false
  min_keep: 10
  enc_mask_scale: [0.85, 1.0]
  enc_mask_aspect: [1.0, 1.0]
  pred_mask_scale: [0.15, 0.2]
  pred_mask_aspect: [0.75, 1.5]
  # training (AdamW; direct lr; constant WD; cosine LR with warmup)
  epochs: 300
  batch_size: 1024
  lr: 6.0e-4                    # = 1.5e-4 x 1024/256 (unified linear scaling)
  start_lr: 0.0                # warm-up from 0
  final_lr: 1.0e-6            # cosine decay end LR
  weight_decay: 0.05           # unified WD
  final_wd: 0.05              # constant WD (== weight_decay, no cosine in step 2)
  warmup_epochs: 10
  clip_grad: 10.0
  ipe_scale: 1.0
  beta1: 0.9
  beta2: 0.95
  # EMA target encoder (cosine momentum schedule)
  start_ema: 0.996
  final_ema: 1.0
  # milestone checkpoints for the frozen-backbone probe sweep
  save_at_epochs: [100, 200, 300]
