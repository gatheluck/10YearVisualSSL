# I-JEPA linear evaluation: a linear probe on the frozen target ViT encoder.
#
# The probe reads the model this port trains (the target ViT's mean-pooled patch
# tokens, one embed_dim vector per image -- I-JEPA has no CLS token), so its number
# is a genuine, comparable linear probe. It follows the shared ARSSL protocol
# (mean-centre + L2-normalise features, a single linear layer, SGD + cosine) used
# by the other ported methods, so the number is comparable across them. The I-JEPA
# step-1 knobs (predictor, masking, schedules, EMA) are not accepted here.
#
# The encoder dims (name + img_size + patch_size) are named so the frozen backbone
# can be rebuilt to load encoder.pt. The capture's own eval trains an AdamW head;
# this port uses the shared SGD+cosine probe instead (a documented deviation).
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt from a step-1 run
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  # model (the backbone is a fixed target ViT encoder; these dims rebuild it)
  name: vit_huge
  img_size: 224
  patch_size: 14
  # probe: a single linear layer, SGD + cosine
  epochs: 100
  batch_size: 256
  num_workers: 10
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
