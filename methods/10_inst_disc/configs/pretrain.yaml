# InstDisc step 1: ResNet-50 + NCE memory bank (Wu et al., CVPR 2018;
# arXiv:1805.01978).
#
# These are the settings the paper uses -- the recipe, not a result. Nothing here
# has executed a full run; the README says what was and was not exercised.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # model / data (build_resnet_instdisc + ImageFolderWithIndex)
  feature_dim: 128       # low-dim embedding (paper Table 1)
  img_size: 224
  # NCE (memory bank)
  temperature: 0.07      # tau (paper Section 3.3)
  nce_momentum: 0.5      # memory-bank update momentum
  num_negatives: 4096    # m (paper Table 1)
  # training (SGD, as in the paper Section 4)
  epochs: 200
  batch_size: 256
  num_workers: 8
  lr: 0.03
  momentum: 0.9          # SGD momentum
  weight_decay: 1.0e-4
