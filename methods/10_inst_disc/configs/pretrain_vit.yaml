# Instance Discrimination Step 2: unified ViT-B/16 pretraining, from scratch.
#
# The capture's Step-2 backbone is the same ViT-B/16 for every method; InstDisc
# plugs in the non-parametric NCE objective over a momentum memory bank (one row
# per training instance), the ViT's CLS token through Linear(768, feature_dim),
# L2-normalised. Optimiser AdamW (default betas), linear warmup then cosine to
# min_lr; checkpoints at 100/200/300 (the memory bank rides in each checkpoint).
# Matching the capture's ViT NCE loop, there is no AMP and no gradient clipping.
# The native ResNet-50/SGD pretrain (configs/pretrain.yaml, no arch) is unchanged.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
#
#   python3 bin/launch.py --config methods/10_inst_disc/configs/pretrain_vit.yaml \
#       --method 10_inst_disc --set DATA_ROOT=/path/to/imagenet
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  arch: vit
  # ViT-B/16 (build_vit_instdisc) + Linear(768, feature_dim) head
  feature_dim: 128
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  drop_rate: 0.0
  attn_drop_rate: 0.0
  # NCE memory bank
  temperature: 0.07
  nce_momentum: 0.5
  num_negatives: 4096
  # training: AdamW + cosine (10-epoch warmup) to min_lr
  epochs: 300
  batch_size: 1024
  num_workers: 8
  lr: 0.0006
  weight_decay: 0.05
  warmup_epochs: 10
  min_lr: 0.0
  save_at_epochs: [100, 200, 300]
