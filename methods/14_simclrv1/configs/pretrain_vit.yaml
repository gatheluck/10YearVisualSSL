# SimCLR v1 Step 2: unified ViT-B/16 pretraining, from scratch.
#
# The capture's Step-2 backbone is the same ViT-B/16 for every method; SimCLR v1
# plugs in NT-Xent over two augmented views. The ViT's CLS token feeds a 2-layer
# projector (768->2048->128), L2-normalised; NT-Xent with temperature 0.07. AdamW
# (default betas), linear warmup then cosine to min_lr, grad clip, AMP on CUDA;
# checkpoints at 100/200/300. The native ResNet-50/LARS pretrain
# (configs/pretrain.yaml, no arch) is unchanged.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
#
#   python3 bin/launch.py --config methods/14_simclrv1/configs/pretrain_vit.yaml \
#       --method 14_simclrv1 --set DATA_ROOT=/path/to/imagenet
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  arch: vit
  # ViT-B/16 (build_vit_simclr) + 2-layer projector
  out_dim: 128
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  drop_rate: 0.0
  attn_drop_rate: 0.0
  # NT-Xent + two-view augmentation
  temperature: 0.07
  color_jitter_strength: 1.0
  # training: AdamW + cosine (10-epoch warmup) to min_lr, AMP, grad clip
  epochs: 300
  batch_size: 1024
  num_workers: 8
  lr: 0.0006
  weight_decay: 0.05
  warmup_epochs: 10
  min_lr: 1.0e-6
  clip_grad: 1.0
  save_at_epochs: [100, 200, 300]
