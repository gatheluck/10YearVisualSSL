# MAE step 1: masked-autoencoder pretraining (He et al., 2021; arXiv:2111.06377),
# the ViT-L/16 recipe.
#
# These are the settings the recipe uses -- the recipe, not a result. Nothing
# here has executed a full run (MAE pretrains for 1600 epochs); the README says
# what was and was not exercised.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # model (build_mae): the architecture, so load_encoder can rebuild it.
  arch: vit_large_patch16
  img_size: 224
  patch_size: 16
  enc_embed_dim: 1024
  enc_depth: 24
  enc_num_heads: 16
  dec_embed_dim: 512
  dec_depth: 8
  dec_num_heads: 16
  mlp_ratio: 4.0
  mask_ratio: 0.75
  norm_pix_loss: true
  # training
  epochs: 1600
  batch_size: 4096
  num_workers: 8
  lr: 1.5e-4
  weight_decay: 0.05
