# CLIP linear evaluation (Step 2): a probe on the frozen from-scratch ViT-B/16.
#
# This evaluates the unified Step-2 encoder (recipe: unified). It freezes the
# trained image tower (encoder.pt the pretrain produced) and probes its pooled
# image embedding, following the shared ARSSL protocol (mean-centre + L2-normalise,
# a single linear layer, SGD + cosine). It is a different comparison from the
# eval-only Step-1 (configs/linear_eval.yaml), which probes the official downloaded
# ViT-B/32.
#
# WARNING: the Step-2 backbone is a supervised label-text adaptation (see
# configs/pretrain_vit.yaml); this number is a CLIP-adaptation reference, not a
# comparable self-supervised result.
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt (or a milestone encoder_epoch{N}.pt) from a
#                            unified pretrain run
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  recipe: unified
  # backbone (third_party/CLIP): the trained ViT-B/16 image tower the pretrain made.
  resolution: 224
  patch_size: 16
  width: 768
  layers: 12
  heads: 12
  output_dim: 512
  # probe: a single linear layer, SGD + cosine.
  epochs: 100
  batch_size: 256
  num_workers: 8
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0
