# BEiT v2 linear evaluation: a linear probe on the frozen pretrained backbone.
#
# This port is eval-only (see the adapter docstring): BEiT v2's as-is comparison
# freezes the official self-supervised pretrained backbone and probes its pooled
# patch-token feature, and the from-scratch pretraining (a VQ-KD visual tokenizer +
# masked image modelling, many GPU-days) is the excluded step. The probed
# representation is a genuine learned SSL feature -- so this number is comparable
# (the "pretrained-backbone reuse" row, the autoregressive/MIM sibling of eva02 /
# 36_franca). See docs/EVAL_DOWNLOAD.md.
#
# The backbone class is the author's, imported from the pinned microsoft/unilm
# submodule (third_party/unilm/beit2, MIT). Two paths are passed at run time, not
# shipped:
#   --set DATA_ROOT=<path>     an ImageFolder with train/ and val/ subdirectories
#   --set BEITV2_CKPT=<path>   the official beitv2_base_patch16_224_pt1k.pth. Obtain
#                              it with `python3 bin/fetch-weights.py --provenance
#                              methods/beitv2/provenance.json --artifact
#                              backbone_artifact --out <dir>` (it is pinned by
#                              sha256 in provenance.json). Required for a
#                              meaningful number; the hermetic smoke leaves it
#                              empty and builds a random tiny backbone, so its
#                              accuracy is meaningless and only the pipeline runs.
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # backbone: the official BEiT v2 base (patch 16, 224px) pt1k self-supervised
  # checkpoint. The rel-pos-bias / mean-pooling architecture is fixed in the
  # backbone; only the size knobs are settings here.
  name: beitv2_base_patch16_224
  ckpt: "${BEITV2_CKPT}"
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  # probe: a single linear layer, SGD + cosine.
  epochs: 100
  batch_size: 32
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
