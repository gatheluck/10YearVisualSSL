# videomae linear evaluation: a linear probe on the frozen pretrained backbone.
#
# This port is eval-only (see the adapter docstring): VideoMAE's as-is comparison
# freezes the pretrained video encoder and probes its temporally-averaged patch
# tokens, and the masked-video-autoencoding pretraining (Kinetics/SSv2, many
# GPU-days) is the excluded step. The probed representation is a genuine SSL
# feature -- so this number is comparable (the "pretrained-backbone reuse" row,
# analogous to eva02 / aimv2 / data2vec2 / cae). See docs/EVAL_DOWNLOAD.md.
#
# The model is a small self-contained VideoMAE ViT in evaluate_linear_videomae.py,
# not a git submodule and not a pip model class. Two paths are passed at run time,
# not shipped:
#   --set DATA_ROOT=<path>        an ImageFolder with train/ and val/ subdirectories
#   --set VIDEOMAE_CKPT=<path>    the official MCG-NJU/videomae-base checkpoint.
#                                 Obtain it with `python3 bin/fetch-weights.py
#                                 --provenance methods/videomae/provenance.json
#                                 --artifact backbone_artifact --out <dir>` (it is
#                                 pinned by sha256 in provenance.json). Required for
#                                 a meaningful number; the hermetic smoke leaves it
#                                 empty and builds a random tiny backbone, so its
#                                 accuracy is meaningless and only the pipeline runs.
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # backbone: the official MCG-NJU/videomae-base (ViT-B/16, 224px, 16-frame clip,
  # tubelet 2). The architecture is given explicitly and the checkpoint's
  # videomae.* encoder tensors are loaded into the self-contained ViT.
  name: MCG-NJU/videomae-base
  ckpt: "${VIDEOMAE_CKPT}"
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  num_frames: 16
  tubelet_size: 2
  # probe: a single linear layer, SGD + cosine.
  epochs: 100
  batch_size: 32
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
