# Jigsaw++ linear evaluation: a linear probe on the frozen VGG16 encoder.
#
# The probe reads the model this port trains (the shared VGG16 encoder, one
# 1024-d feature per image), so its number is a genuine, comparable linear probe.
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt from a pretrain run
# The output path is fixed at --out. The model settings must match the pretrain run
# that produced ENCODER.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  # model (must match the pretrain run so encoder.pt loads)
  num_permutations: 701
  dropout: 0.5
  tile_size: 75
  tile_gap: 0
  image_size: 255
  grayscale_prob: 0.7
  max_occlusions: 2
  # probe: a single linear layer, SGD + cosine
  epochs: 90
  batch_size: 256
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
