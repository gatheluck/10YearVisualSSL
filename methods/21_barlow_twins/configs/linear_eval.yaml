# Barlow Twins linear evaluation: frozen ResNet-50 backbone on ImageNet-1k.
#
# The second stage freezes the encoder step 1 produced and fits a linear
# classifier on real labels. These are the numbers this project compares.
#
# The encoder to evaluate is `encoder.pt` from a step-1 run: pass it with
# `--set ENCODER=<path>/encoder.pt`. The data path is `--set DATA_ROOT=<path>`
# (the evaluation reads `<path>/train` and `<path>/val`). The output path is
# `--out`. `projector` is declared because the encoder is not self-describing;
# it must match the step-1 run that produced the encoder.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  epochs: 100
  batch_size: 256
  lr: 0.3
  num_workers: 8
  img_size: 224
  projector: "8192-8192-8192"
