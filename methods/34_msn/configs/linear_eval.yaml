# MSN linear evaluation: a linear probe on the frozen anchor backbone.
#
# The probe reads the model this port trains (the MSN anchor ViT's CLS token, one
# embed_dim vector per image), so its number is a genuine, comparable linear probe.
# It follows the shared ARSSL protocol (mean-centre + L2-normalise features, a
# single linear layer, SGD + cosine) used by the other ported methods. The MSN
# step-1 knobs (prototypes, focal views, sharpen) are not accepted here. The
# capture's own MSN eval runs the official cyanure logistic probe; this port uses
# the shared frozen-feature probe instead (a documented deviation).
#
# The backbone dims are named so the frozen ViT trunk can be rebuilt to load
# encoder.pt.
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt from a step-1 run
# The output path is fixed at --out.
stage: linear_eval
seed: 0
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  # model (the backbone is a fixed ViT trunk; these dims rebuild it)
  img_size: 224
  patch_size: 16
  embed_dim: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  # probe: a single linear layer, SGD + cosine
  epochs: 100
  batch_size: 256
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
