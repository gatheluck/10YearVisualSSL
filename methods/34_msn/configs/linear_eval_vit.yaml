# MSN linear evaluation: a linear probe on the frozen unified deit_base/16 anchor
# backbone.
#
# This is the evaluation for the unified Step-2 encoder (deit_base dims). It is
# identical to configs/linear_eval.yaml except for the encoder dims (embed_dim +
# num_heads), which the adapter uses to rebuild the ViT backbone and load
# encoder.pt. The probe reads the anchor ViT's CLS token and follows the shared
# ARSSL protocol (mean-centre + L2-normalise, a single linear layer, SGD +
# cosine), so the number is comparable across the ported methods.
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt (or a milestone encoder_epoch{N}.pt) from a
#                            unified pretrain run
# The output path is fixed at --out.
stage: linear_eval
seed: 0
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  # model (the backbone is a fixed ViT trunk; these dims rebuild it)
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  # probe: a single linear layer, SGD + cosine
  epochs: 100
  batch_size: 256
  num_workers: 10
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
