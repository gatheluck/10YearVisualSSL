# MSN step 1: ViT-S/16 masked siamese pretraining on ImageNet-1k
# (Assran et al., 2022; arXiv:2204.07141), the official deit_small recipe.
#
# These are the paper-target settings (the official facebookresearch/msn
# configs/pretrain/msn_vits16.yaml) -- the recipe, not a result. Nothing here has
# executed a full run; the README says what was and was not exercised. The ViT and
# the MSN loss are the pinned upstream (third_party/msn), imported not copied; only
# the multi-view augmentation is reimplemented and the trainer is single-process.
#
# Licence: the msn code is CC BY-NC 4.0 (non-commercial). This port is for academic
# research only; see provenance.json and README.md.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
stage: step1
seed: 0
data_root: "${DATA_ROOT}"
device: auto

train:
  # model (build_msn_model): deit_small ViT trunk + projection head fc
  img_size: 224           # the rand (large) view resolution
  patch_size: 16
  embed_dim: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  use_bn: true
  hidden_dim: 2048
  output_dim: 256
  drop_path_rate: 0.0
  # data (multi-view: rand + focal crops)
  focal_size: 96
  rand_crop_scale: [0.3, 1.0]
  focal_crop_scale: [0.05, 0.3]
  color_jitter: 0.5
  rand_views: 1
  focal_views: 10
  patch_drop: 0.15
  num_workers: 10
  label_smoothing: 0.0
  # criterion (MSN loss over prototypes + me-max)
  num_proto: 1024
  temperature: 0.1
  start_sharpen: 0.25
  final_sharpen: 0.25
  me_max: true
  memax_weight: 1.0
  use_ent: true
  ent_weight: 0.0
  use_sinkhorn: true
  # training (AdamW + warmup->cosine LR; EMA target 0.996 -> 1.0)
  epochs: 800
  batch_size: 64
  lr: 1.0e-3
  start_lr: 2.0e-4
  final_lr: 1.0e-6
  warmup: 15
  weight_decay: 0.04
  final_weight_decay: 0.4
  clip_grad: 3.0
  ema_start: 0.996
  ema_final: 1.0
