# CPC Step 2: unified ViT-B/16 pretraining, from scratch.
#
# The capture's Step-2 backbone is the same ViT-B/16 for every method; CPC uses
# the ViT's patch tokens as its z-grid (14x14 for ViT-B/16 at 224), a column-wise
# GRU as the context, and k=5 linear predictors under an InfoNCE loss. The ViT's
# CLS token is the linear-probe feature. Optimiser AdamW, linear warmup then
# cosine to min_lr; checkpoints at 100/200/300. Matching the capture's ViT CPC
# loop, there is no AMP and no gradient clipping. The native visual-CPC-2018
# patch-encoder pretrain (configs/pretrain.yaml, no arch) is unchanged.
#
# One path is passed at run time, not shipped:
#   --set DATA_ROOT=<path>   the dataset root; pretraining reads its train/ subdirectory
# The output path is fixed at --out.
#
#   python3 bin/launch.py --config methods/11_cpc/configs/pretrain_vit.yaml \
#       --method 11_cpc --set DATA_ROOT=/path/to/imagenet
stage: pretrain
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  arch: vit
  # CPC on the ViT patch grid (build_cpc_vit): z_dim must equal embed_dim
  z_dim: 768
  c_dim: 768
  pred_steps: 5
  # ViT-B/16
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  drop_rate: 0.0
  attn_drop_rate: 0.0
  # InfoNCE
  temperature: 0.07
  # training: AdamW + cosine (10-epoch warmup) to min_lr
  epochs: 300
  batch_size: 1024
  num_workers: 8
  lr: 0.0006             # unified peak = 1.5e-4 x (batch_size / 256); used directly
  weight_decay: 0.05
  warmup_epochs: 10
  min_lr: 0.0
  save_at_epochs: [100, 200, 300]
