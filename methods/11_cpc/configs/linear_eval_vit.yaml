# CPC unified ViT-B/16 linear evaluation: a linear probe on the frozen ViT.
#
# The probe reads the ViT this port's Step 2 trains, at its CLS token (768-d),
# so its number is a genuine, comparable linear probe. Images use the plain
# ImageNet val pipeline (resize + centre crop + ImageNet normalisation), NOT the
# native patch grid. The model dimensions must match the Step-2 run that produced
# ENCODER so encoder.pt loads.
#
# Two paths are passed at run time, not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set ENCODER=<path>     encoder.pt (or encoder_epoch{N}.pt) from a Step-2 run
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto
encoder: "${ENCODER}"

train:
  arch: vit
  # model (must match the Step-2 run so encoder.pt loads); z_dim == embed_dim
  z_dim: 768
  c_dim: 768
  pred_steps: 5
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  drop_rate: 0.0
  attn_drop_rate: 0.0
  # probe: a single linear layer, SGD + cosine
  epochs: 100
  batch_size: 256
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
