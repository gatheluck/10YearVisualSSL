# Step 1: Context Prediction pretraining, official-style track.
# Doersch et al., "Unsupervised Visual Representation Learning by Context
# Prediction", ICCV 2015.
#
# The values below are the ones the captured cluster runs used. They follow the
# released deepcontext implementation rather than the paper text where the two
# differ; see README.md in this directory for the specific differences.
#
# Resolve before running, so that the run is identified by a hash:
#   python3 bin/resolve-config.py --config methods/01_context_prediction/configs/step1.yaml \
#       --out runs/ctxpred/resolved.json --set DATA_ROOT=/path/to/ILSVRC2012

# Which stage this config runs. Not a command-line flag: the contract
# fixes the adapter's arguments at two, so anything affecting the result
# has to sit inside config_sha256.
stage: step1

seed: 42

# ImageNet root. Must contain train/ and val/. Passed in explicitly: the
# resolver never reads the environment, so the same config cannot silently
# mean different data on a different machine.
data_root: "${DATA_ROOT}"

# auto uses cuda when it is available. Added during the port; the captured
# original hard-coded cuda and could not run anywhere else.
device: auto

train:
  # deepcontext trains for a long time at a small, fixed learning rate.
  max_steps: 1000000
  # Per-GPU directed patch pairs. The captured job scripts run 8 GPUs.
  batch_size: 64
  num_workers: 8
  # Fixed throughout: no schedule, no warmup, momentum 0, weight decay 0.
  lr: 1.0e-5
  save_every_steps: 2000
  eval_every_steps: 2000
  eval_batches: 50
