# cae linear evaluation: a linear probe on the frozen pretrained backbone.
#
# This port is eval-only (see the adapter docstring): CAE's as-is comparison
# freezes the pretrained vision backbone and probes its CLS token, and the
# from-scratch context-autoencoder pretraining (IN-1k, many GPU-days) is the
# excluded step. The probed representation is a genuine SSL feature -- so this
# number is comparable (the "pretrained-backbone reuse" row, analogous to
# eva02 / aimv2 / data2vec2 / 36_franca). See docs/EVAL_DOWNLOAD.md.
#
# The model is a small self-contained BEiT-style ViT in evaluate_linear_cae.py,
# not a git submodule and not a pip model class. Two paths are passed at run time,
# not shipped:
#   --set DATA_ROOT=<path>   an ImageFolder with train/ and val/ subdirectories
#   --set CAE_CKPT=<path>    the OpenMMLab mmselfsup CAE ViT-B checkpoint. Obtain
#                            it with `python3 bin/fetch-weights.py --provenance
#                            methods/cae/provenance.json --artifact
#                            backbone_artifact --out <dir>` (it is pinned by
#                            sha256 in provenance.json). Required for a meaningful
#                            number; the hermetic smoke leaves it empty and builds
#                            a random tiny backbone, so its accuracy is meaningless
#                            and only the pipeline runs.
# The output path is fixed at --out.
stage: linear_eval
seed: 42
data_root: "${DATA_ROOT}"
device: auto

train:
  # backbone: the OpenMMLab mmselfsup reproduction of CAE ViT-B/16 (224px). The
  # architecture is given explicitly and the checkpoint's backbone.* tensors are
  # loaded into the self-contained ViT.
  name: cae_vit-base-p16 (OpenMMLab mmselfsup reproduction)
  ckpt: "${CAE_CKPT}"
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  # probe: a single linear layer, SGD + cosine.
  epochs: 100
  batch_size: 32
  num_workers: 8
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
